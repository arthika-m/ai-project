<!DOCTYPE html>
<html>

<head>

    <title>Student Management System</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <h2>Login</h2>


    <form onsubmit="login(event)">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >


        <input
            type="submit"
            value="Login"
        >

    </form>


    <p>

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>

</div>


<script>

function login(event) {

    event.preventDefault();


    const user = {

        email:
            document.getElementById("email").value,

        password:
            document.getElementById("password").value

    };


    fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(user)

    })

    .then(function(response) {

        return response.json();

    })

    .then(function(data) {

        if (data.success) {

            alert(data.message);

            window.location.href =
                "dashboard.html";

        }
        else {

            alert(data.message);

        }

    });

}

</script>

</body>

</html>
